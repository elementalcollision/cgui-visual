<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24324D"/><stop offset="1" stop-color="#0D1422"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9DAFF"/><stop offset="1" stop-color="#4C93EC"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F5FA8"/><stop offset="1" stop-color="#173A73"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9F4A"/><stop offset="1" stop-color="#E0612A"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FB4FF"/><stop offset="1" stop-color="#2E78D6"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/><stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect x="100" y="112" width="824" height="824" rx="185" fill="#000" opacity="0.35" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)"/>
  <g clip-path="url(#body)">
    <rect x="100" y="782" width="830" height="150" fill="#0A1628"/>
    <rect x="150" y="826" width="96" height="9" rx="4.5" fill="#2A4A78"/>
    <rect x="300" y="862" width="128" height="9" rx="4.5" fill="#2A4A78"/>
    <rect x="470" y="826" width="84" height="9" rx="4.5" fill="#2A4A78"/>
  </g>
  <!-- quay deck under the legs -->
  <rect x="540" y="768" width="400" height="30" rx="6" fill="#2A3B5C" clip-path="url(#body)"/>
  <!-- forestays and backstay -->
  <g stroke="#9CC5FF" stroke-width="13" stroke-linecap="round">
    <line x1="690" y1="236" x2="214" y2="412"/>
    <line x1="690" y1="236" x2="420" y2="412"/>
    <line x1="690" y1="236" x2="858" y2="412"/>
  </g>
  <!-- A-frame -->
  <path d="M598 414 L676 232 L704 232 L782 414 L748 414 L690 276 L632 414 Z" fill="url(#steel)"/>
  <!-- legs -->
  <rect x="574" y="430" width="44" height="342" rx="6" fill="url(#steel)"/>
  <rect x="764" y="430" width="44" height="342" rx="6" fill="url(#steel)"/>
  <!-- portal beam and X-brace -->
  <rect x="574" y="610" width="234" height="28" rx="6" fill="url(#steel)"/>
  <g stroke="url(#steel)" stroke-width="16" stroke-linecap="round">
    <line x1="604" y1="604" x2="778" y2="460"/>
    <line x1="604" y1="460" x2="778" y2="604"/>
  </g>
  <!-- boom, tapering at the tip -->
  <path d="M196 404 L876 400 Q888 400 888 412 L888 438 Q888 450 876 450 L196 444 Q184 443 184 432 L184 416 Q184 405 196 404 Z" fill="url(#steel)"/>
  <!-- machinery house -->
  <rect x="790" y="350" width="94" height="58" rx="8" fill="url(#steel)"/>
  <!-- trolley, ropes, spreader -->
  <rect x="318" y="446" width="96" height="30" rx="6" fill="url(#steel)"/>
  <g stroke="#9CC5FF" stroke-width="8"><line x1="336" y1="474" x2="314" y2="566"/><line x1="396" y1="474" x2="418" y2="566"/></g>
  <rect x="270" y="562" width="192" height="20" rx="6" fill="url(#steel)"/>
  
  <rect x="276" y="584" width="180" height="104" rx="10" fill="url(#box)"/>
  <rect x="298" y="598" width="7" height="76" rx="3" fill="#B8481C" opacity="0.55"/><rect x="322" y="598" width="7" height="76" rx="3" fill="#B8481C" opacity="0.55"/><rect x="346" y="598" width="7" height="76" rx="3" fill="#B8481C" opacity="0.55"/><rect x="370" y="598" width="7" height="76" rx="3" fill="#B8481C" opacity="0.55"/><rect x="394" y="598" width="7" height="76" rx="3" fill="#B8481C" opacity="0.55"/><rect x="418" y="598" width="7" height="76" rx="3" fill="#B8481C" opacity="0.55"/>
  <rect x="276" y="584" width="180" height="10" rx="5" fill="#FFFFFF" opacity="0.25"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#rim)"/>
</svg>
