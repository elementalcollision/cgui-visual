# Dependabot config. Weekly checks.
#
# - The Tauri stack (tauri, tauri-*, wry, tao on the Rust side; @tauri-apps/*
#   on the npm side) must move together, so each ecosystem has a `tauri`
#   group. Groups are matched in order, so `tauri` is declared first and
#   claims those packages before `minor-and-patch` can.
# - Other minor + patch bumps are batched per ecosystem to cut noise.
# - Major bumps outside the Tauri group stay as individual PRs so they get
#   proper attention.
# - open-pull-requests-limit is generous so version-update PRs for majors
#   can't starve the queue. (Security updates have their own, separate limit
#   in Dependabot, but a larger limit keeps grouped PRs visible too.)
# - GitHub Actions checks monthly since action major bumps are infrequent
#   and rarely urgent.

version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      tauri:
        patterns:
          - "@tauri-apps/*"
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      tauri:
        patterns:
          - "tauri"
          - "tauri-*"
          - "wry"
          - "tao"
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
