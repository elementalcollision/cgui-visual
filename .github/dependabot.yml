# Dependabot config. Weekly checks; group patch + minor bumps so we don't
# get a deluge of noise PRs. Major bumps stay separate so they get the
# attention they deserve. GitHub Actions checks monthly since action major
# bumps are infrequent and rarely urgent.

version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
