name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# This project is macOS-only — it wraps Apple's `container` CLI, which has no
# Linux or Windows equivalent. The Linux compile-only job that used to live
# here was dropped for that reason.

jobs:
  frontend:
    name: Frontend (vitest + tsc + vite)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  rust:
    name: Backend (cargo test + check)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo build --release --bin app
