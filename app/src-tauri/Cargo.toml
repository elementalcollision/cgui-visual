[package]
name = "app"
version = "0.1.1"
description = "Desktop GUI for Apple's container runtime (cgui)"
authors = ["elementalcollision"]
edition = "2021"
license = "MIT"
repository = "https://github.com/elementalcollision/cgui"
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "net"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
toml = { version = "1", default-features = false, features = ["parse", "display"] }
serde_yaml = "0.9"

